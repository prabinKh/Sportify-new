name: Docker

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: docker-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  frontend:
    name: Build frontend image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}/frontend" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_SPOTIFY_CLIENT_ID=${{ vars.VITE_SPOTIFY_CLIENT_ID || secrets.VITE_SPOTIFY_CLIENT_ID }}
            VITE_SPOTIFY_REDIRECT_URL=${{ vars.VITE_SPOTIFY_REDIRECT_URL || secrets.VITE_SPOTIFY_REDIRECT_URL }}
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || secrets.VITE_API_BASE_URL }}
            VITE_LOCAL_IP=${{ vars.VITE_LOCAL_IP || secrets.VITE_LOCAL_IP }}

  backend:
    name: Build backend image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}/backend" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./youtube-audio-api
          file: ./youtube-audio-api/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy over SSH
    needs: [frontend, backend]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tags
        run: |
          prefix="${GITHUB_REPOSITORY,,}"
          echo "FRONTEND_IMAGE=ghcr.io/${prefix}/frontend:latest" >> "$GITHUB_ENV"
          echo "BACKEND_IMAGE=ghcr.io/${prefix}/backend:latest" >> "$GITHUB_ENV"

      - name: Resolve SSH connection
        id: ssh
        run: |
          echo "host=${{ secrets.SSH_HOST }}" >> "$GITHUB_OUTPUT"
          echo "user=${{ secrets.SSH_USER }}" >> "$GITHUB_OUTPUT"
          echo "port=${{ secrets.SSH_PORT || '22' }}" >> "$GITHUB_OUTPUT"

      - name: Copy compose file to host
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ steps.ssh.outputs.host }}
          username: ${{ steps.ssh.outputs.user }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ steps.ssh.outputs.port }}
          source: docker-compose.deploy.yml
          target: sportify
          overwrite: true

      - name: Pull images and restart containers
        uses: appleboy/ssh-action@v1.2.2
        env:
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEB_PORT: ${{ vars.WEB_PORT || '3004' }}
          API_PORT: ${{ vars.API_PORT || '8004' }}
        with:
          host: ${{ steps.ssh.outputs.host }}
          username: ${{ steps.ssh.outputs.user }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ steps.ssh.outputs.port }}
          command_timeout: 10m
          envs: FRONTEND_IMAGE,BACKEND_IMAGE,GHCR_USER,GHCR_TOKEN,WEB_PORT,API_PORT
          script: |
            set -euo pipefail
            APP_DIR="$HOME/sportify"
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"
            mv -f docker-compose.deploy.yml docker-compose.yml
            cat <<EOF > .env
            FRONTEND_IMAGE=${FRONTEND_IMAGE}
            BACKEND_IMAGE=${BACKEND_IMAGE}
            WEB_PORT=${WEB_PORT:-3004}
            API_PORT=${API_PORT:-8004}
            EOF

            # Helper: run docker, escalate with sudo if needed
            run_docker() {
              if docker info > /dev/null 2>&1; then
                docker "$@"
              else
                sudo docker "$@"
              fi
            }

            # Prefer IPv4 to avoid ghcr.io IPv6 connection resets on VPS
            if [ -f /etc/gai.conf ] && ! grep -q "^precedence ::ffff:0:0/96  100" /etc/gai.conf; then
              sudo sed -i 's/#precedence ::ffff:0:0\/96  100/precedence ::ffff:0:0\/96  100/' /etc/gai.conf 2>/dev/null || true
            fi

            echo "Logging in to GHCR..."
            run_docker login ghcr.io -u "$GHCR_USER" -p "$GHCR_TOKEN"

            echo "Pulling Spotify images with auto-retry..."
            PULL_SUCCESS=false
            for attempt in 1 2 3 4 5; do
              if run_docker compose -p spotify pull; then
                PULL_SUCCESS=true
                break
              fi
              echo "Pull attempt $attempt failed (network reset). Retrying in 5s..."
              sleep 5
            done

            if [ "$PULL_SUCCESS" != "true" ]; then
              echo "Error: Failed to pull images after 5 attempts."
              exit 1
            fi

            echo "Starting Spotify containers on ports: Frontend=$WEB_PORT, Backend=$API_PORT..."
            run_docker compose -p spotify up -d --remove-orphans

            run_docker image prune -f
            echo "=== Sportify deployed successfully on ports: Frontend=$WEB_PORT, Backend=$API_PORT ==="
